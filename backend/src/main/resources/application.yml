server:
  port: ${PORT:8080}

spring:
  application:
    name: acme-salary-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/acme_salary?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:acme}
    password: ${SPRING_DATASOURCE_PASSWORD:acme}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_boolean_jdbc_type: BIT
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.acme.salary: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

acme:
  jwt:
    secret: ${ACME_JWT_SECRET:acme-salary-demo-secret-change-me-please-32b}
    ttl-hours: 8
  seed:
    enabled: ${ACME_SEED_ENABLED:true}
    employees: 10000
    demo-password: Password123!
  cors:
    origins: "${ACME_CORS_ORIGINS:http://localhost:5173,http://localhost:8081,http://localhost:80,http://localhost}"
    origin-patterns: "${ACME_CORS_ORIGIN_PATTERNS:https://*.vercel.app}"

spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:salary;MODE=LEGACY;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

acme:
  seed:
    enabled: false
    employees: 0
  jwt:
    secret: "test-secret-test-secret-test-secret-32"
    ttl-hours: 1

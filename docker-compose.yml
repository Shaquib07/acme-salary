services:
  api:
    build: ./backend
    ports:
      - "8080:8080"
    volumes:
      - salary-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - api

volumes:
  salary-data:
